# Use the image's Caddyfile instead of /etc/caddy/Caddyfile, whose default
# site also claims port 80
[Service]
ExecStartPre=
ExecStartPre=/usr/bin/caddy validate --config /usr/share/my-private-os/caddy/Caddyfile
ExecStart=
ExecStart=/usr/bin/caddy run --environ --config /usr/share/my-private-os/caddy/Caddyfile
ExecReload=
ExecReload=/usr/bin/caddy reload --config /usr/share/my-private-os/caddy/Caddyfile
