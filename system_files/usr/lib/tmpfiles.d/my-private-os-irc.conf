# Ergo's data (accounts, channels) and the env file with its oper password
# hash, which stays on the Pi. Empty until set, podman needs it to exist.
d /var/lib/ergo 0700 root root - -
d /etc/ergo 0700 root root - -
f /etc/ergo/ergo.env 0600 root root - -
# The caddy package creates its home in /var at install time, which bootc
# doesn't apply to an existing system
d /var/lib/caddy 0750 caddy caddy - -
