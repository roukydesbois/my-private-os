# The Pi 4's display driver. Fedora IoT installs the Pi with the kernel
# argument modprobe.blacklist=vc4, which bootc keeps after switching to this
# image: the screen then stays on simpledrm (no HDMI connectors for
# has-screen, no display acceleration). That blacklist only stops alias-based
# loading, so loading it by name here works. Better still, remove the
# argument once: sudo rpm-ostree kargs --delete=modprobe.blacklist=vc4
vc4
