---
name: Clean up old images
on:
  schedule:
    - cron: '30 11 * * 0'  # Sundays 11:30 UTC, after the daily 10:05 build
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/cleanup-images.yml'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete old image versions from ghcr.io
    runs-on: ubuntu-latest

    permissions:
      packages: write

    steps:
      # Keeps every image from the last 30 days, `latest`, and the 5 newest
      # tagged images older than that. Cosign signatures and multi-arch
      # children follow their parent image; orphaned signatures are deleted.
      # Older images can be restored from the version IDs in the job log.
      - name: Clean up ghcr.io package
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          older-than: 30 days
          exclude-tags: latest
          keep-n-tagged: 5
          delete-untagged: true
          delete-orphaned-images: true
          # PRs touching this workflow only report what would be deleted.
          dry-run: ${{ github.event_name == 'pull_request' }}
